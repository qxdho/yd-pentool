name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 静态分析
        run: flutter analyze
      - name: 单元测试
        run: flutter test --reporter expanded

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 环境诊断
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v 2>&1 | Select-Object -First 60

      # 标准做法：在仓库原地生成平台目录，再用 git 还原被模板碰过的源码。
      # 这样 .metadata / windows/ 都是 flutter 认得的正规结构。
      - name: 生成 windows 平台目录
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name yd_pentool .
          git checkout -- .
          Write-Output "--- 生成后的 windows/ 顶层 ---"
          Get-ChildItem windows | Select-Object Name
          Write-Output "--- .metadata ---"
          if (Test-Path .metadata) { Get-Content .metadata } else { Write-Output "缺失!" }

      - name: 确认源码未被模板覆盖
        shell: pwsh
        run: |
          $drift = git status --porcelain -- lib pubspec.yaml test
          Write-Output "源码区改动: [$drift]"
          if ($drift) { Write-Error "lib/pubspec/test 被模板改动，构建中止"; exit 1 }

      - run: flutter pub get

      - name: 编译 Release
        id: build
        shell: pwsh
        run: |
          $out = flutter build windows --release 2>&1
          $code = $LASTEXITCODE
          $out | Out-File -FilePath build.log -Encoding utf8
          $out | Write-Output
          if ($code -ne 0) {
            ($out | Select-Object -Last 120) -join "`n" | Out-File -FilePath build-error.txt -Encoding utf8
          }
          exit $code

      # 日志默认要 admin 才能下载，这里把失败原因写进 commit comment，
      # 外部用公开 API 就能读到。
      - name: 失败时公开诊断信息
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Windows 构建失败\n\n';
            try {
              body += '```\n' + fs.readFileSync('build-error.txt', 'utf8').slice(-50000) + '\n```';
            } catch (e) {
              body += '(没有捕获到 build-error.txt)\n';
            }
            if (body.length > 65000) body = body.slice(0, 65000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore

      - name: 附上说明文档
        if: success()
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          Copy-Item docs\FLOW.md $out
          if (Test-Path "artifacts\adb.exe") { Copy-Item "artifacts\adb.exe" $out }

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yd-pentool-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
