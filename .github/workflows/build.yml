name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 静态分析
        id: analyze
        shell: bash
        run: |
          set +e
          # flutter analyze 默认 --fatal-infos=true，任何 lint 提示都会让构建失败。
          # 这里只把 error / warning 当失败，信息级 lint 仅记录。
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then tail -n 80 analyze.log > analyze-error.txt; fi
          exit $code
      - name: 单元测试
        id: unittest
        shell: bash
        run: |
          set +e
          : > test.log
          fail=0
          for f in test/*_test.dart; do
            echo "===== RUN $f =====" >> test.log
            flutter test --reporter expanded "$f" > "out.tmp" 2>&1
            rc=$?
            cat out.tmp >> test.log
            echo "===== EXIT $rc  ($f) =====" >> test.log
            echo "--- $f exit=$rc"
            tail -n 5 out.tmp
            if [ $rc -ne 0 ]; then fail=1; fi
          done
          if [ $fail -ne 0 ]; then
            {
              grep -nE "Error|Exception|Expected|Actual|Which:|failed|FAILED|Timeout|Stack|#[0-9]+ " test.log | head -70
              echo "### 最后 30 行"
              tail -n 30 test.log
            } > test-error.txt
          fi
          exit $fail
      - name: 失败时输出诊断注解
        if: failure()
        shell: bash
        run: |
          for f in analyze-error.txt test-error.txt; do
            if [ -f "$f" ]; then
              n=0
              while IFS= read -r line; do
                if [ -n "$line" ]; then echo "::error title=${f}::$line"; fi
                n=$((n+1))
                if [ $n -ge 90 ]; then break; fi
              done < "$f"
            fi
          done

  build-windows:
    # Flutter 3.24 的生成器映射只认 VS 主版本 17（VS2022）：
    #   17 => 'Visual Studio 17 2022'，其余一律退回 'Visual Studio 16 2019'
    # windows-latest 已经漂移到更新镜像（VS 主版本不是 17），所以这里锁死 2022。
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 环境诊断
        shell: pwsh
        run: |
          flutter --version
          Write-Output "--- vswhere 已安装的 VS ---"
          $vw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vw) {
            & $vw -all -products * -property installationVersion
            & $vw -all -products * -property displayName
          } else { Write-Output "vswhere 不存在" }
          Write-Output "--- flutter doctor ---"
          flutter doctor -v 2>&1 | Select-Object -First 40

      # 标准做法：在仓库原地生成平台目录，再用 git 还原被模板碰过的源码。
      # 这样 .metadata / windows/ 都是 flutter 认得的正规结构。
      - name: 生成 windows 平台目录
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name yd_pentool . | Out-String | Write-Host
          git checkout -- .
          # 模板会塞一个计数器 demo 测试进来，删掉，别污染源码区
          if (Test-Path test\widget_test.dart) { Remove-Item -Force test\widget_test.dart }
          Write-Output "--- 生成后的 windows/ 顶层 ---"
          Get-ChildItem windows | Select-Object Name
          Write-Output "--- .metadata ---"
          if (Test-Path .metadata) { Get-Content .metadata } else { Write-Output "缺失!" }

      - name: 确认源码未被模板覆盖
        shell: pwsh
        run: |
          # 只关心被修改的已跟踪文件；平台目录与 .metadata 是模板新生成的，不算污染
          $drift = git status --porcelain --untracked-files=no -- lib pubspec.yaml test
          Write-Output "源码区改动: [$drift]"
          if ($drift) { Write-Error "lib/pubspec/test 被模板改动，构建中止"; exit 1 }

      - run: flutter pub get

      - name: 编译 Release
        id: build
        shell: pwsh
        run: |
          $out = flutter build windows --release 2>&1
          $code = $LASTEXITCODE
          $out | Out-File -FilePath build.log -Encoding utf8
          $out | Write-Output
          if ($code -ne 0) {
            ($out | Select-Object -Last 120) -join "`n" | Out-File -FilePath build-error.txt -Encoding utf8
          }
          exit $code

      # 日志默认要 admin 才能下载，这里把失败原因写进 commit comment，
      # 外部用公开 API 就能读到。
      - name: 失败时输出诊断注解
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build-error.txt) {
            $n = 0
            Get-Content build-error.txt | ForEach-Object {
              if ($_ -and $n -lt 60) { Write-Output "::error title=build::$_" }
              $n++
            }
          }

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore

      - name: 附上说明文档
        if: success()
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          Copy-Item docs\FLOW.md $out
          if (Test-Path "artifacts\adb.exe") { Copy-Item "artifacts\adb.exe" $out }

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yd-pentool-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
